name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch:          # allows manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  github-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: isaad-ui
          filename: assets/generated/stats.svg
          base: header, activity, community, repositories
          config_timezone: Africa/Accra
          plugin_languages: yes
          plugin_languages_limit: 6

      - name: Top Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: isaad-ui
          filename: assets/generated/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          config_timezone: Africa/Accra

      - name: Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          user: isaad-ui
          output_path: assets/generated/streak.svg
          hide_border: true
          background: "00000000"
          ring: "39FF88"
          fire: "39FF88"
          currStreakLabel: "39FF88"
          sideLabels: "ffffff"
          dates: "8b949e"
          border: "00000000"
        continue-on-error: true

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/generated/
          git diff --staged --quiet || git commit -m "chore: update github stats [skip ci]"
          git push
