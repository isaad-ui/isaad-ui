<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 404" width="1000" height="404" role="img" aria-label="Website Uptime Monitor. Checks whether a website is up and reports the HTTP status code, response time and timestamp. It handles timeouts, SSL errors and connection failures. It started as a Python script and now has a FastAPI backend, a React dashboard with check history, and automated tests that run in GitHub Actions. Built with Python, FastAPI, React, pytest, GitHub Actions.">
<style>
.up{opacity:0;animation:up .8s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.go{animation:go 7s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes go{to{stroke-dashoffset:-1000}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

</style>
<rect width="1000" height="404" fill="#0D1117"/>
<rect class="up" style="animation-delay:0.1s" x="20" y="8" width="960" height="388" rx="18" fill="#141A22" stroke="#2A323C" stroke-width="1.5"/><rect class="go" pathLength="1000" x="20" y="8" width="960" height="388" rx="18" fill="none" stroke="#39FF88" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 890" opacity=".9"/><text class="up" style="animation-delay:.2s" x="52" y="62" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="18" letter-spacing="3" fill="#39FF88">PROJECT 02</text><text class="up" style="animation-delay:.3s" x="52" y="114" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="38" font-weight="700" fill="#E6EDF3">Website Uptime Monitor</text><text class="up" style="animation-delay:0.45s" x="52" y="164" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#9BA7B4">Checks whether a website is up and reports the HTTP status code, response time</text><text class="up" style="animation-delay:0.55s" x="52" y="200" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#9BA7B4">and timestamp. It handles timeouts, SSL errors and connection failures. It</text><text class="up" style="animation-delay:0.65s" x="52" y="236" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#9BA7B4">started as a Python script and now has a FastAPI backend, a React dashboard</text><text class="up" style="animation-delay:0.75s" x="52" y="272" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="23" fill="#9BA7B4">with check history, and automated tests that run in GitHub Actions.</text><g class="pop" style="animation-delay:0.85s"><rect x="52" y="320" width="99" height="44" rx="22" fill="#1B2430" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.2"/><text x="101.5" y="349" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#E6EDF3">Python</text></g><g class="pop" style="animation-delay:0.97s"><rect x="163" y="320" width="109" height="44" rx="22" fill="#1B2430" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.2"/><text x="217.5" y="349" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#E6EDF3">FastAPI</text></g><g class="pop" style="animation-delay:1.09s"><rect x="284" y="320" width="88" height="44" rx="22" fill="#1B2430" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.2"/><text x="328.0" y="349" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#E6EDF3">React</text></g><g class="pop" style="animation-delay:1.21s"><rect x="384" y="320" width="99" height="44" rx="22" fill="#1B2430" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.2"/><text x="433.5" y="349" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#E6EDF3">pytest</text></g><g class="pop" style="animation-delay:1.33s"><rect x="495" y="320" width="183" height="44" rx="22" fill="#1B2430" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.2"/><text x="586.5" y="349" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="21" fill="#E6EDF3">GitHub Actions</text></g>
</svg>