<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 526" width="1000" height="526" role="img" aria-label="BSc Computer Science student at the University of Ghana, expected graduation 2028, based in Accra. Building practical tools in Python and JavaScript, focusing on software engineering and Python development, with a longer-term move towards AI engineering.">
<style>
.up{opacity:0;animation:up .8s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.go{animation:go 7s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes go{to{stroke-dashoffset:-1000}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

</style>
<rect width="1000" height="526" fill="#0D1117"/>
<rect class="up" style="animation-delay:0.1s" x="20" y="8" width="960" height="510" rx="18" fill="#141A22" stroke="#2A323C" stroke-width="1.5"/><rect class="go" pathLength="1000" x="20" y="8" width="960" height="510" rx="18" fill="none" stroke="#39FF88" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 890" opacity=".9"/><text class="up" style="animation-delay:0.30s" x="52" y="64" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#E6EDF3">I am a BSc Computer Science student at the University of Ghana, based in</text><text class="up" style="animation-delay:0.42s" x="52" y="102" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#E6EDF3">Accra. I enjoy building practical tools, mostly in Python and JavaScript,</text><text class="up" style="animation-delay:0.54s" x="52" y="140" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#E6EDF3">and I am focusing on software engineering and Python development.</text><text class="up" style="animation-delay:0.66s" x="52" y="192" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#9BA7B4">I build projects to learn how real software works: calling APIs, handling</text><text class="up" style="animation-delay:0.78s" x="52" y="230" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#9BA7B4">errors, writing tests and deploying what I make. Over time I want to move</text><text class="up" style="animation-delay:0.90s" x="52" y="268" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="24" fill="#9BA7B4">towards AI engineering.</text><g class="pop" style="animation-delay:1.02s"><rect x="40" y="320" width="450" height="78" rx="14" fill="#1B2430" stroke="#2A323C" stroke-width="1.2"/><rect x="40" y="336" width="4" height="46" rx="2" fill="#39FF88"/><text x="66" y="351" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="16" letter-spacing="2" fill="#9BA7B4">UNIVERSITY</text><text x="66" y="382" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E6EDF3">University of Ghana</text></g><g class="pop" style="animation-delay:1.17s"><rect x="510" y="320" width="450" height="78" rx="14" fill="#1B2430" stroke="#2A323C" stroke-width="1.2"/><rect x="510" y="336" width="4" height="46" rx="2" fill="#39FF88"/><text x="536" y="351" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="16" letter-spacing="2" fill="#9BA7B4">PROGRAMME</text><text x="536" y="382" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E6EDF3">BSc Computer Science</text></g><g class="pop" style="animation-delay:1.32s"><rect x="40" y="412" width="450" height="78" rx="14" fill="#1B2430" stroke="#2A323C" stroke-width="1.2"/><rect x="40" y="428" width="4" height="46" rx="2" fill="#39FF88"/><text x="66" y="443" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="16" letter-spacing="2" fill="#9BA7B4">EXPECTED GRADUATION</text><text x="66" y="474" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E6EDF3">2028</text></g><g class="pop" style="animation-delay:1.47s"><rect x="510" y="412" width="450" height="78" rx="14" fill="#1B2430" stroke="#2A323C" stroke-width="1.2"/><rect x="510" y="428" width="4" height="46" rx="2" fill="#39FF88"/><text x="536" y="443" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="16" letter-spacing="2" fill="#9BA7B4">LOCATION</text><text x="536" y="474" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" font-weight="600" fill="#E6EDF3">Accra, Ghana</text></g>
</svg>