<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="1000" height="70" role="img" aria-label="Goals">
<style>
.b{animation:pulse 2.4s ease-in-out infinite}
.t{opacity:0;animation:in .8s ease-out .1s forwards}
.l{stroke-dasharray:960;stroke-dashoffset:960;animation:draw 1.2s ease-out .3s forwards}
.d{animation:run 5s linear 1.5s infinite;opacity:0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(960px);opacity:0}}
</style>
<rect width="1000" height="70" fill="#0D1117"/>
<rect class="b" x="20" y="20" width="10" height="26" rx="2" fill="#39FF88"/>
<text class="t" x="46" y="42" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#E6EDF3">Goals</text>
<line class="l" x1="20" y1="58" x2="980" y2="58" stroke="#39FF88" stroke-opacity=".35" stroke-width="1.5"/>
<circle class="d" cx="20" cy="58" r="3.5" fill="#39FF88"/>
</svg>