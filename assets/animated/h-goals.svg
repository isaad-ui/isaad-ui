<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 90" width="1000" height="90" role="img" aria-label="Goals">
<style>
.up{opacity:0;animation:up .8s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.go{animation:go 7s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes go{to{stroke-dashoffset:-1000}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.run{animation:run 6s ease-in-out infinite}@keyframes run{0%{transform:translateX(0);opacity:0}8%,92%{opacity:1}100%{transform:translateX(960px);opacity:0}}
</style>
<rect width="1000" height="90" fill="#0D1117"/>
<g class="up" style="animation-delay:.05s"><rect x="20" y="12" width="60" height="44" rx="12" fill="#1B2430" stroke="#39FF88" stroke-opacity=".45" stroke-width="1.3"/>
<text x="50" y="43" text-anchor="middle" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="22" font-weight="700" fill="#39FF88">05</text></g>
<text class="up" style="animation-delay:.2s" x="100" y="46" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="36" font-weight="700" fill="#E6EDF3">Goals</text>
<line x1="20" y1="76" x2="980" y2="76" stroke="#2A323C" stroke-width="1.5"/>
<circle class="run" cx="20" cy="76" r="4" fill="#39FF88"/>
</svg>