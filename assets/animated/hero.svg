<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" width="1000" height="326" role="img" aria-label="Issaka Sa-ad Timbilla. BSc Computer Science student at the University of Ghana, Accra. Open to internships.">
<style>
.up{opacity:0;animation:up .8s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.go{animation:go 7s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes go{to{stroke-dashoffset:-1000}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bar 1s ease-out .6s forwards}
@keyframes bar{to{transform:scaleX(1)}}
</style>
<rect width="1000" height="326" fill="#0D1117"/>
<rect class="up" style="animation-delay:.1s" x="60" y="62" width="36" height="3" rx="1.5" fill="#39D5FF"/>
<text class="up" style="animation-delay:.15s" x="108" y="70" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="20" letter-spacing="4" fill="#39D5FF">HELLO, I'M</text>
<text class="up" style="animation-delay:.35s" x="60" y="156" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="66" font-weight="700" fill="#E6EDF3">Issaka Sa-ad Timbilla</text>
<rect class="bar" x="60" y="180" width="140" height="5" rx="2.5" fill="#58A6FF"/>
<text class="up" style="animation-delay:.9s" x="60" y="232" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="22" fill="#8B949E">BSc Computer Science · University of Ghana · Accra, Ghana</text>
<g class="up" style="animation-delay:1.1s"><rect x="60" y="258" width="290" height="44" rx="22" fill="#1C2330" stroke="#58A6FF" stroke-opacity=".5" stroke-width="1.2"/>
<circle class="pulse" cx="88" cy="280" r="6" fill="#39D5FF"/><text x="106" y="287" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="20" fill="#E6EDF3">Open to internships</text></g>
</svg>