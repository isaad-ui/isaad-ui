<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Issaka Sa-ad Timbilla, BSc Computer Science student at the University of Ghana">
<style>
.name{opacity:0;animation:up 1s ease-out .2s forwards}
.sub{opacity:0;animation:up 1s ease-out .7s forwards}
.rule{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.4s ease-out .5s forwards}
.sweep{animation:sweep 6s ease-in-out 2s infinite}
.role{opacity:0}
.r0{animation:role 12s ease-in-out infinite;animation-delay:0s}.r1{animation:role 12s ease-in-out infinite;animation-delay:3s}.r2{animation:role 12s ease-in-out infinite;animation-delay:6s}.r3{animation:role 12s ease-in-out infinite;animation-delay:9s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes sweep{0%{transform:translateX(-300px);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateX(1300px);opacity:0}}
@keyframes role{0%{opacity:0;transform:translateY(12px)}5%,20%{opacity:1;transform:none}24%,100%{opacity:0;transform:translateY(-12px)}}
</style>
<rect width="1000" height="230" fill="#0D1117"/>
<rect class="sweep" x="0" y="0" width="140" height="230" fill="#39FF88" opacity="0" transform="skewX(-20)"/>
<text class="name" x="500" y="85" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#E6EDF3">Issaka Sa-ad Timbilla</text>
<line class="rule" x1="240" y1="108" x2="760" y2="108" stroke="#39FF88" stroke-width="2"/>
<text class="sub" x="500" y="138" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" fill="#8B949E">BSc Computer Science · University of Ghana</text>
<text class="role r0" x="500" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#39FF88">Python Developer</text>
<text class="role r1" x="500" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#39FF88">Software Engineering Student</text>
<text class="role r2" x="500" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#39FF88">Building APIs and Web Apps</text>
<text class="role r3" x="500" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#39FF88">Growing interest in AI Engineering</text>

</svg>