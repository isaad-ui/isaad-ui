<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Website Uptime Monitor">
<style>
.o{stroke-dasharray:180 2100;animation:go 5s linear infinite}
.c{opacity:0;animation:in .9s ease-out .2s forwards}
@keyframes go{to{stroke-dashoffset:-2280}}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
<rect width="1000" height="150" fill="#0D1117"/>
<rect x="10" y="10" width="980" height="130" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
<rect class="o" x="10" y="10" width="980" height="130" rx="12" fill="none" stroke="#39FF88" stroke-width="3" stroke-linecap="round"/>
<g class="c">
<text x="44" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="700" fill="#E6EDF3">Website Uptime Monitor</text>
<text x="44" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#8B949E">Check website status, response time and history</text>
<text x="44" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#39FF88">Python · FastAPI · React · pytest · GitHub Actions</text>
</g>
</svg>