<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 212" width="1000" height="212" role="img" aria-label="I am open to internships and collaboration on small projects. Feel free to get in touch on LinkedIn.">
<style>
.up{opacity:0;animation:up .8s ease-out forwards}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .55s cubic-bezier(.2,.9,.3,1.25) forwards}
.go{animation:go 7s linear infinite}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes go{to{stroke-dashoffset:-1000}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

</style>
<rect width="1000" height="212" fill="#0D1117"/>
<rect class="up" style="animation-delay:0.1s" x="20" y="8" width="960" height="196" rx="18" fill="#161B22" stroke="#30363D" stroke-width="1.5"/><rect class="go" pathLength="1000" x="20" y="8" width="960" height="196" rx="18" fill="none" stroke="#39D5FF" stroke-width="2" stroke-linecap="round" stroke-dasharray="110 890" opacity=".8"/><circle class="pulse" cx="60" cy="64" r="7" fill="#58A6FF"/><text class="up" x="82" y="71" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="18" letter-spacing="3" fill="#58A6FF">AVAILABLE FOR INTERNSHIPS</text><text class="up" style="animation-delay:0.30s" x="52" y="122" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#E6EDF3">I am open to internships and collaboration on small projects. Feel</text><text class="up" style="animation-delay:0.45s" x="52" y="162" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="26" fill="#E6EDF3">free to get in touch on LinkedIn.</text>
</svg>