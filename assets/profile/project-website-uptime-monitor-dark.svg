<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 224" width="700" height="224" role="img" aria-label="Website Uptime Monitor. Checks whether a website is up and reports its HTTP status code, response time and timestamp, handling timeouts, SSL errors and connection failures. It started as a Python script and now also has a FastAPI backend, a React dashboard with check history, and automated tests that run in GitHub Actions. Python · FastAPI · React · pytest · GitHub Actions.">
<defs><filter id="t" x="-4%" y="-10%" width="108%" height="120%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" result="warp"><animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="warp" scale="3" xChannelSelector="R" yChannelSelector="G" result="shape"/><feGaussianBlur in="shape" stdDeviation="1.2" result="soft"/><feSpecularLighting in="soft" surfaceScale="3" specularConstant=".55" specularExponent="18" lighting-color="#ffffff" result="spec"><feDistantLight azimuth="225" elevation="55"/></feSpecularLighting><feComposite in="spec" in2="shape" operator="in" result="specIn"/><feComposite in="shape" in2="specIn" operator="arithmetic" k1="0" k2="1" k3=".45" k4="0"/></filter>
<filter id="b" x="-2%" y="-5%" width="104%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="1" seed="1" result="w"><animate attributeName="seed" values="1;2;3;4;5;6;7;8" dur="1.1s" calcMode="discrete" repeatCount="indefinite"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="w" scale="1.6" xChannelSelector="R" yChannelSelector="G"/></filter>
<clipPath id="u"><rect x="4" y="44" width="385" height="5" rx="2.5"/></clipPath></defs>
<g filter="url(#t)">
<text x="4" y="34" font-family="'Arial Rounded MT Bold','Nunito','Trebuchet MS','Segoe UI Black',Arial,sans-serif" font-weight="900" font-size="26" fill="#DCE5DF" textLength="385" lengthAdjust="spacingAndGlyphs">Website Uptime Monitor</text>
<rect x="4" y="44" width="385" height="5" rx="2.5" fill="#75B9A8"/>
<g clip-path="url(#u)"><ellipse cx="26" cy="46" rx="16.0" ry="5.0" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="15 4 9 4" transform="rotate(0 26 46)"/><ellipse cx="26" cy="46" rx="12.2" ry="3.8" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="11 3 7 3" transform="rotate(0 26 46)"/><ellipse cx="26" cy="46" rx="8.6" ry="2.7" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="8 3 5 3" transform="rotate(0 26 46)"/><ellipse cx="26" cy="46" rx="5.4" ry="1.7" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="5 3" transform="rotate(0 26 46)"/><ellipse cx="359" cy="46" rx="16.0" ry="5.0" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="15 4 9 4" transform="rotate(0 359 46)"/><ellipse cx="359" cy="46" rx="12.2" ry="3.8" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="11 3 7 3" transform="rotate(0 359 46)"/><ellipse cx="359" cy="46" rx="8.6" ry="2.7" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="8 3 5 3" transform="rotate(0 359 46)"/><ellipse cx="359" cy="46" rx="5.4" ry="1.7" fill="none" stroke="rgba(0,0,0,0.16)" stroke-width="1.3" stroke-dasharray="5 3" transform="rotate(0 359 46)"/></g>
</g>
<g filter="url(#b)"><text x="4" y="78" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#DCE5DF">Checks whether a website is up and reports its HTTP status code, response time</text><text x="4" y="105" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#DCE5DF">and timestamp, handling timeouts, SSL errors and connection failures. It started</text><text x="4" y="132" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#DCE5DF">as a Python script and now also has a FastAPI backend, a React dashboard with</text><text x="4" y="159" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="17" fill="#DCE5DF">check history, and automated tests that run in GitHub Actions.</text>
<text x="4" y="200" font-family="Consolas,'SFMono-Regular','Courier New',monospace" font-size="15" fill="#75B9A8">Python · FastAPI · React · pytest · GitHub Actions</text></g>
