<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 130" width="700" height="130" role="img" aria-label="Issaka Sa-ad Timbilla. Computer Science student building practical software.">
<style>
.fade{opacity:0;animation:fade .9s ease-out forwards}
.line{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:line .9s ease-out .5s forwards}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes line{to{transform:scaleX(1)}}
</style>
<text class="fade" x="2" y="58" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="46" fill="#DCE5DF">Issaka Sa-ad Timbilla</text>
<rect class="line" x="2" y="76" width="64" height="2" fill="#75B9A8"/>
<text class="fade" style="animation-delay:.7s" x="2" y="110" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="19" fill="#A9B5B0">Computer Science student building practical software.</text>
</svg>
