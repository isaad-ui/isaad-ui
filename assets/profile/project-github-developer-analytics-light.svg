<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 197" width="700" height="197" role="img" aria-label="GitHub Developer Analytics. Enter any public GitHub username to see a profile summary, language breakdown, repository statistics and a searchable repository list. It uses the GitHub REST API, with a React web app and a Python terminal version. Python · JavaScript · React · Vite · GitHub API.">
