<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#050505"/>
<stop offset="50%" stop-color="#0b1710"/>
<stop offset="100%" stop-color="#050505"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<rect width="1200" height="330" fill="url(#bg)"/>

<g opacity="0.15" stroke="#39ff88">
<path d="M0 60 H1200"/>
<path d="M0 120 H1200"/>
<path d="M0 180 H1200"/>
<path d="M0 240 H1200"/>
<path d="M0 300 H1200"/>
<path d="M100 0 V330"/>
<path d="M300 0 V330"/>
<path d="M500 0 V330"/>
<path d="M700 0 V330"/>
<path d="M900 0 V330"/>
<path d="M1100 0 V330"/>
</g>

<circle cx="80" cy="70" r="3" fill="#39ff88" filter="url(#glow)">
<animate attributeName="cx" values="80;1120;80" dur="7s" repeatCount="indefinite"/>
</circle>

<circle cx="1120" cy="250" r="3" fill="#39ff88" filter="url(#glow)">
<animate attributeName="cx" values="1120;80;1120" dur="9s" repeatCount="indefinite"/>
</circle>

<text x="600"
y="105"
text-anchor="middle"
font-family="monospace"
font-size="52"
font-weight="700"
fill="#39ff88"
filter="url(#glow)">

ISSAKA SA-AD TIMBILLA

<animate
attributeName="opacity"
values="0;1;1;0.4;1"
dur="2.5s"
repeatCount="indefinite"/>

</text>

<text x="600"
y="145"
text-anchor="middle"
font-family="monospace"
font-size="19"
fill="#ffffff">

Computer Science Student • Python Developer

</text>

<text x="600"
y="190"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#39ff88">

&gt; Building software that solves real problems

<animate
attributeName="opacity"
values="1;1;0;0;1"
keyTimes="0;0.25;0.35;0.75;1"
dur="10s"
repeatCount="indefinite"/>

</text>

<text x="600"
y="190"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#39ff88"
opacity="0">

&gt; Turning ideas into working systems

<animate
attributeName="opacity"
values="0;0;1;1;0"
keyTimes="0;0.25;0.35;0.6;0.7"
dur="10s"
repeatCount="indefinite"/>

</text>

<text x="600"
y="190"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#39ff88"
opacity="0">

&gt; Learn • Build • Analyze • Improve

<animate
attributeName="opacity"
values="0;0;0;1;1;0"
keyTimes="0;0.5;0.6;0.65;0.9;1"
dur="10s"
repeatCount="indefinite"/>

</text>

<text x="600"
y="235"
text-anchor="middle"
font-family="monospace"
font-size="14"
fill="#8b949e">

[ Python ] [ Data Science ] [ Machine Learning ] [ AI ]

</text>

<line
x1="300"
y1="270"
x2="900"
y2="270"
stroke="#39ff88"
stroke-width="1"
opacity="0.4"/>

<circle cx="300" cy="270" r="4" fill="#39ff88">

<animate
attributeName="cx"
values="300;900;300"
dur="4s"
repeatCount="indefinite"/>

</circle>

<text x="600"
y="305"
text-anchor="middle"
font-family="monospace"
font-size="13"
fill="#586069">

echo "Always learning. Always building."

</text>

</svg>