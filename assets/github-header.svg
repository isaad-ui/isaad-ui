<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#020403"/>
<stop offset="50%" stop-color="#08160e"/>
<stop offset="100%" stop-color="#020403"/>
</linearGradient>

<filter id="glow">
<feGaussianBlur stdDeviation="4" result="blur"/>
<feMerge>
<feMergeNode in="blur"/>
<feMergeNode in="SourceGraphic"/>
</feMerge>
</filter>
</defs>

<rect width="1200" height="360" fill="url(#bg)"/>

<g stroke="#39ff88" opacity="0.08">
<path d="M0 60H1200"/>
<path d="M0 120H1200"/>
<path d="M0 180H1200"/>
<path d="M0 240H1200"/>
<path d="M0 300H1200"/>
<path d="M100 0V360"/>
<path d="M300 0V360"/>
<path d="M500 0V360"/>
<path d="M700 0V360"/>
<path d="M900 0V360"/>
<path d="M1100 0V360"/>
</g>

<g fill="#39ff88" filter="url(#glow)">

<circle cx="80" cy="80" r="3">
<animate attributeName="cy" values="80;290;80" dur="5s" repeatCount="indefinite"/>
</circle>

<circle cx="1100" cy="280" r="3">
<animate attributeName="cy" values="280;70;280" dur="6s" repeatCount="indefinite"/>
</circle>

<circle cx="200" cy="300" r="2">
<animate attributeName="cx" values="200;1000;200" dur="8s" repeatCount="indefinite"/>
</circle>

<circle cx="1000" cy="60" r="2">
<animate attributeName="cx" values="1000;200;1000" dur="7s" repeatCount="indefinite"/>
</circle>

</g>

<text x="600" y="125"
text-anchor="middle"
font-family="monospace"
font-size="50"
font-weight="700"
fill="#39ff88"
filter="url(#glow)">

ISSAKA SA-AD TIMBILLA

<animate attributeName="opacity"
values="0;1;1;0.7;1"
dur="3s"
repeatCount="indefinite"/>

</text>

<text x="600" y="160"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="white">

COMPUTER SCIENCE STUDENT • PYTHON DEVELOPER

<animate attributeName="opacity"
values="0.4;1;0.4"
dur="3s"
repeatCount="indefinite"/>

</text>

<text x="600" y="210"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#39ff88">

&gt; BUILDING SOFTWARE THAT SOLVES REAL PROBLEMS

<animate attributeName="opacity"
values="1;1;0;0;1"
keyTimes="0;0.3;0.4;0.8;1"
dur="7s"
repeatCount="indefinite"/>

</text>

<text x="600" y="210"
text-anchor="middle"
font-family="monospace"
font-size="18"
fill="#39ff88"
opacity="0">

&gt; TURNING IDEAS INTO WORKING SYSTEMS

<animate attributeName="opacity"
values="0;0;1;1;0"
keyTimes="0;0.3;0.4;0.8;1"
dur="7s"
repeatCount="indefinite"/>

</text>

<text x="600" y="250"
text-anchor="middle"
font-family="monospace"
font-size="14"
fill="#8b949e">

[ PYTHON ] [ DATA ] [ MACHINE LEARNING ] [ AI ]

</text>

<line x1="320" y1="285" x2="880" y2="285"
stroke="#39ff88"
opacity="0.3"/>

<circle cx="320" cy="285" r="4" fill="#39ff88">
<animate attributeName="cx"
values="320;880;320"
dur="4s"
repeatCount="indefinite"/>
</circle>

<text x="600" y="325"
text-anchor="middle"
font-family="monospace"
font-size="13"
fill="#586069">

echo "Always learning. Always building."

</text>

</svg>
